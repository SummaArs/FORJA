name: FORJA proof

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run FORJA proof
        run: ./prove.sh
      - name: Compile sources
        run: python -m compileall -q forja_ledger tests
      - name: Validate enterprise portfolio
        run: PYTHONPATH=. python -m forja_core check examples/enterprise-portfolio.json
      - name: Compile adapter sources
        run: python -m compileall -q forja_core tests
      - name: Verify created examples
        run: PYTHONPATH=. python -m unittest -v tests.test_created_examples
      - name: Verify enterprise blueprint
        run: PYTHONPATH=. python -m unittest -v tests.test_blueprint
